services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: niceagent
      POSTGRES_USER: niceagent
      POSTGRES_PASSWORD: niceagent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  control-plane:
    image: golang:1.23-alpine
    working_dir: /workspace/services/control-plane
    command: go run ./cmd
    environment:
      CONTROL_PLANE_ADDR: ":8080"
      NICEAGENT_ENV: local
      AUTH_MODE: demo
      DISPATCH_MODE: http
      EVENT_FANOUT_MODE: redis
      EVENT_FANOUT_PREFIX: niceagent:run-events
      RUN_QUEUE_MAX_LEN: "0"
      STORE_DRIVER: postgres
      AGENT_RUNTIME_URL: http://agent-runtime:8081
      CONTROL_PLANE_PUBLIC_URL: http://control-plane:8080
      INTERNAL_API_TOKEN: niceagent-local-internal-token
      INTERNAL_API_TOKEN_REQUIRED: "false"
      OTEL_TRACES_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_INSECURE: "false"
      OTEL_EXPORTER_OTLP_HEADERS: ""
      QUOTA_MAX_CONCURRENT_RUNS: "0"
      QUOTA_RUNS_PER_HOUR: "0"
      QUOTA_MODEL_TOKENS_PER_DAY: "0"
      QUOTA_TOOL_CALLS_PER_DAY: "0"
      QUOTA_SANDBOX_SECONDS_PER_DAY: "0"
      QUOTA_COUNTER_MODE: redis
      QUOTA_COUNTER_PREFIX: niceagent:quota
      QUOTA_MODEL_TOKEN_RESERVATION_PER_RUN: "0"
      QUOTA_MODEL_TOKEN_RESERVATION_MODE: fixed
      QUOTA_MODEL_TOKEN_DYNAMIC_OUTPUT_BUFFER: "0"
      DATABASE_URL: postgres://niceagent:niceagent@postgres:5432/niceagent?sslmode=disable
      REDIS_ADDR: redis:6379
      WEB_DIST_DIR: /workspace/frontend/dist
      SANDBOX_WORKSPACE_ROOT: /workspace/workspaces
    ports:
      - "8080:8080"
    volumes:
      - ..:/workspace
    depends_on:
      - postgres
      - redis

  agent-runtime:
    image: golang:1.23-alpine
    working_dir: /workspace/services/agent-runtime
    command: go run ./cmd
    environment:
      AGENT_RUNTIME_ADDR: ":8081"
      NICEAGENT_ENV: local
      AGENT_RUNTIME_ID: agent-runtime-compose
      RUNTIME_QUEUE_MODE: disabled
      CONTROL_PLANE_URL: http://control-plane:8080
      SANDBOX_EXECUTOR_URL: http://sandbox-executor:8082
      INTERNAL_API_TOKEN: niceagent-local-internal-token
      INTERNAL_API_TOKEN_REQUIRED: "false"
      OTEL_TRACES_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_INSECURE: "false"
      OTEL_EXPORTER_OTLP_HEADERS: ""
      MODEL_PROVIDER: mock
      MODEL_PROVIDER_PROFILE: ""
      MODEL_FALLBACK_PROVIDER: ""
      MODEL_FALLBACK_BASE_URL: ""
      MODEL_FALLBACK_API_KEY: ""
      MODEL_FALLBACK_NAME: ""
      MODEL_TIMEOUT_SECONDS: "120"
      MODEL_INPUT_PRICE_PER_1M_TOKENS: "0"
      MODEL_CACHED_INPUT_PRICE_PER_1M_TOKENS: "0"
      MODEL_OUTPUT_PRICE_PER_1M_TOKENS: "0"
      MODEL_REASONING_PRICE_PER_1M_TOKENS: "0"
      MODEL_PRICE_CURRENCY: USD
      MODEL_HEALTH_PROBE_ENABLED: "false"
      MODEL_HEALTH_PROBE_INTERVAL_SECONDS: "60"
      MODEL_HEALTH_PROBE_TIMEOUT_SECONDS: "10"
      MODEL_HEALTH_PROBE_INITIAL_DELAY_SECONDS: "0"
      REDIS_ADDR: redis:6379
      RUN_QUEUE_STREAM: niceagent:runs
      RUN_QUEUE_GROUP: agent-runtimes
      RUN_QUEUE_CONSUMER: agent-runtime-compose
      RUN_QUEUE_MAX_LEN: "0"
      RUN_QUEUE_RECLAIM_MIN_IDLE_SECONDS: "60"
      RUN_QUEUE_RECLAIM_COUNT: "1"
      RUN_QUEUE_MAX_DELIVERIES: "5"
      RUN_QUEUE_DLQ_STREAM: niceagent:runs:dlq
      RUN_QUEUE_DLQ_MAX_LEN: "0"
      RUN_ATTEMPT_LEASE_SECONDS: "600"
      RUN_ATTEMPT_HEARTBEAT_SECONDS: "60"
      SANDBOX_WORKSPACE_ROOT: /workspace/workspaces
    ports:
      - "8081:8081"
    volumes:
      - ..:/workspace
    depends_on:
      - control-plane
      - sandbox-executor

  sandbox-executor:
    image: golang:1.23-alpine
    working_dir: /workspace/services/sandbox-executor
    command: go run ./cmd
    environment:
      SANDBOX_EXECUTOR_ADDR: ":8082"
      NICEAGENT_ENV: local
      INTERNAL_API_TOKEN: niceagent-local-internal-token
      INTERNAL_API_TOKEN_REQUIRED: "false"
      OTEL_TRACES_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_INSECURE: "false"
      OTEL_EXPORTER_OTLP_HEADERS: ""
      EXECUTOR_MODE: local
      SANDBOX_WORKSPACE_ROOT: /workspace/workspaces
    ports:
      - "8082:8082"
    volumes:
      - ..:/workspace

volumes:
  postgres-data:
