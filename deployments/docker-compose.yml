services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: niceagent
      POSTGRES_USER: niceagent
      POSTGRES_PASSWORD: niceagent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  control-plane:
    image: golang:1.22-alpine
    working_dir: /workspace/services/control-plane
    command: go run ./cmd
    environment:
      CONTROL_PLANE_ADDR: ":8080"
      DISPATCH_MODE: http
      STORE_DRIVER: postgres
      AGENT_RUNTIME_URL: http://agent-runtime:8081
      CONTROL_PLANE_PUBLIC_URL: http://control-plane:8080
      DATABASE_URL: postgres://niceagent:niceagent@postgres:5432/niceagent?sslmode=disable
      REDIS_ADDR: redis:6379
      WEB_DIST_DIR: /workspace/frontend/dist
      SANDBOX_WORKSPACE_ROOT: /workspace/workspaces
    ports:
      - "8080:8080"
    volumes:
      - ..:/workspace
    depends_on:
      - postgres
      - redis

  agent-runtime:
    image: golang:1.22-alpine
    working_dir: /workspace/services/agent-runtime
    command: go run ./cmd
    environment:
      AGENT_RUNTIME_ADDR: ":8081"
      CONTROL_PLANE_URL: http://control-plane:8080
      SANDBOX_EXECUTOR_URL: http://sandbox-executor:8082
      MODEL_PROVIDER: mock
      MODEL_TIMEOUT_SECONDS: "120"
      REDIS_ADDR: redis:6379
      SANDBOX_WORKSPACE_ROOT: /workspace/workspaces
    ports:
      - "8081:8081"
    volumes:
      - ..:/workspace
    depends_on:
      - control-plane
      - sandbox-executor

  sandbox-executor:
    image: golang:1.22-alpine
    working_dir: /workspace/services/sandbox-executor
    command: go run ./cmd
    environment:
      SANDBOX_EXECUTOR_ADDR: ":8082"
      EXECUTOR_MODE: local
      SANDBOX_WORKSPACE_ROOT: /workspace/workspaces
    ports:
      - "8082:8082"
    volumes:
      - ..:/workspace

volumes:
  postgres-data:
