apiVersion: v1
kind: ConfigMap
metadata:
  name: niceagent-config
  namespace: niceagent
data:
  DISPATCH_MODE: "http"
  AGENT_RUNTIME_URL: "http://niceagent-agent-runtime:8081"
  CONTROL_PLANE_PUBLIC_URL: "http://niceagent-control-plane:8080"
  CONTROL_PLANE_URL: "http://niceagent-control-plane:8080"
  SANDBOX_EXECUTOR_URL: "http://niceagent-sandbox-executor:8082"
  REDIS_ADDR: "niceagent-redis:6379"
