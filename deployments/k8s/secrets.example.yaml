apiVersion: v1
kind: Secret
metadata:
  name: niceagent-internal-api
  namespace: niceagent
type: Opaque
stringData:
  token: "replace-with-a-random-internal-token"
---
apiVersion: v1
kind: Secret
metadata:
  name: niceagent-model-provider
  namespace: niceagent
type: Opaque
stringData:
  api-key: "replace-with-model-provider-api-key"
  fallback-api-key: "replace-with-fallback-model-provider-api-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: niceagent-smtp
  namespace: niceagent
type: Opaque
stringData:
  password: "replace-with-smtp-password"
  webhook-secret: "replace-with-random-webhook-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: niceagent-oidc
  namespace: niceagent
type: Opaque
stringData:
  client-secret: "replace-with-oidc-client-secret"
  session-secret: "replace-with-random-session-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: niceagent-otel
  namespace: niceagent
type: Opaque
stringData:
  # 例如 "Authorization=Bearer <collector-token>,x-tenant=niceagent"；没有鉴权时可留空或不创建该 Secret。
  headers: ""
