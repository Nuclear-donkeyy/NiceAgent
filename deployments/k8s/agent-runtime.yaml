apiVersion: apps/v1
kind: Deployment
metadata:
  name: niceagent-agent-runtime
  namespace: niceagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: niceagent-agent-runtime
  template:
    metadata:
      labels:
        app: niceagent-agent-runtime
    spec:
      containers:
        - name: agent-runtime
          image: registry.example.com/niceagent/niceagent-agent-runtime:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: AGENT_RUNTIME_ADDR
              value: ":8081"
            - name: AGENT_RUNTIME_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NICEAGENT_ENV
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: NICEAGENT_ENV
            - name: RUNTIME_QUEUE_MODE
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: RUNTIME_QUEUE_MODE
            - name: CONTROL_PLANE_URL
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: CONTROL_PLANE_URL
            - name: SANDBOX_EXECUTOR_URL
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: SANDBOX_EXECUTOR_URL
            - name: MODEL_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_PROVIDER
            - name: MODEL_PROVIDER_PROFILE
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_PROVIDER_PROFILE
            - name: MODEL_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_BASE_URL
            - name: MODEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_NAME
            - name: MODEL_FALLBACK_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_FALLBACK_PROVIDER
            - name: MODEL_FALLBACK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_FALLBACK_BASE_URL
            - name: MODEL_FALLBACK_NAME
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_FALLBACK_NAME
            - name: MODEL_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_TIMEOUT_SECONDS
            - name: MODEL_INPUT_PRICE_PER_1M_TOKENS
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_INPUT_PRICE_PER_1M_TOKENS
            - name: MODEL_CACHED_INPUT_PRICE_PER_1M_TOKENS
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_CACHED_INPUT_PRICE_PER_1M_TOKENS
            - name: MODEL_OUTPUT_PRICE_PER_1M_TOKENS
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_OUTPUT_PRICE_PER_1M_TOKENS
            - name: MODEL_REASONING_PRICE_PER_1M_TOKENS
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_REASONING_PRICE_PER_1M_TOKENS
            - name: MODEL_PRICE_CURRENCY
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_PRICE_CURRENCY
            - name: MODEL_REQUESTS_PER_MINUTE
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_REQUESTS_PER_MINUTE
            - name: MODEL_MAX_CONCURRENT_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_MAX_CONCURRENT_REQUESTS
            - name: MODEL_HEALTH_PROBE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_HEALTH_PROBE_ENABLED
            - name: MODEL_HEALTH_PROBE_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_HEALTH_PROBE_INTERVAL_SECONDS
            - name: MODEL_HEALTH_PROBE_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_HEALTH_PROBE_TIMEOUT_SECONDS
            - name: MODEL_HEALTH_PROBE_INITIAL_DELAY_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: MODEL_HEALTH_PROBE_INITIAL_DELAY_SECONDS
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: niceagent-model-provider
                  key: api-key
                  optional: true
            - name: MODEL_FALLBACK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: niceagent-model-provider
                  key: fallback-api-key
                  optional: true
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: REDIS_ADDR
            - name: SKILL_RATE_LIMIT_MODE
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: SKILL_RATE_LIMIT_MODE
            - name: SKILL_RATE_LIMIT_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: SKILL_RATE_LIMIT_PREFIX
            - name: SKILL_RISK_POLICY
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: SKILL_RISK_POLICY
            - name: RUN_QUEUE_STREAM
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: RUN_QUEUE_STREAM
            - name: RUN_QUEUE_GROUP
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: RUN_QUEUE_GROUP
            - name: RUN_QUEUE_MAX_LEN
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: RUN_QUEUE_MAX_LEN
            - name: RUN_QUEUE_CONSUMER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUN_QUEUE_RECLAIM_MIN_IDLE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: RUN_QUEUE_RECLAIM_MIN_IDLE_SECONDS
            - name: RUN_QUEUE_RECLAIM_COUNT
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: RUN_QUEUE_RECLAIM_COUNT
            - name: RUN_QUEUE_MAX_DELIVERIES
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: RUN_QUEUE_MAX_DELIVERIES
            - name: RUN_QUEUE_DLQ_STREAM
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: RUN_QUEUE_DLQ_STREAM
            - name: RUN_QUEUE_DLQ_MAX_LEN
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: RUN_QUEUE_DLQ_MAX_LEN
            - name: RUN_ATTEMPT_LEASE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: RUN_ATTEMPT_LEASE_SECONDS
            - name: RUN_ATTEMPT_HEARTBEAT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: RUN_ATTEMPT_HEARTBEAT_SECONDS
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: niceagent-internal-api
                  key: token
                  optional: false
            - name: INTERNAL_API_TOKEN_REQUIRED
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: INTERNAL_API_TOKEN_REQUIRED
            - name: OTEL_TRACES_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: OTEL_TRACES_EXPORTER
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            - name: OTEL_EXPORTER_OTLP_INSECURE
              valueFrom:
                configMapKeyRef:
                  name: niceagent-config
                  key: OTEL_EXPORTER_OTLP_INSECURE
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: niceagent-otel
                  key: headers
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: niceagent-agent-runtime
  namespace: niceagent
spec:
  type: ClusterIP
  selector:
    app: niceagent-agent-runtime
  ports:
    - name: http
      port: 8081
      targetPort: 8081
