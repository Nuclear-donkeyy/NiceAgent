<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NiceAgent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="mark">NA</span>
          <div>
            <h1>NiceAgent</h1>
            <p>远端 Agent 控制台</p>
          </div>
        </div>
        <div class="sidebar-actions">
          <button id="new-chat" class="primary">新建会话</button>
          <button id="refresh-chats" class="secondary">刷新</button>
        </div>
        <div class="section-title">会话</div>
        <nav id="chat-list" class="chat-list"></nav>

        <div class="section-title">可用 Skills</div>
        <section id="skill-list" class="skill-list" aria-live="polite"></section>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">当前会话</p>
            <h2 id="chat-title">尚未选择会话</h2>
          </div>
          <div class="run-controls">
            <div>
              <span class="eyebrow">Run 状态</span>
              <div id="run-status" class="status idle">空闲</div>
            </div>
            <button id="cancel-run" class="danger" type="button" disabled>取消</button>
          </div>
        </header>

        <section id="messages" class="messages"></section>

        <section class="events">
          <div class="panel-heading">
            <div>
              <div class="section-title">运行事件</div>
              <p id="event-summary" class="panel-hint">等待新的 run 事件。</p>
            </div>
            <span id="event-count" class="counter">0</span>
          </div>
          <div class="event-grid">
            <div id="events" class="event-list"></div>
            <aside class="cli-panel">
              <div class="section-title">CLI 输出</div>
              <pre id="cli-output">暂无 CLI 输出。发送 /cli echo hello 可以测试远端 CLI skill。</pre>
            </aside>
          </div>
        </section>

        <form id="composer" class="composer">
          <textarea id="message-input" rows="3" placeholder="向远端 agent 发送任务。试试：/cli echo hello"></textarea>
          <button type="submit" class="primary">发送</button>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
