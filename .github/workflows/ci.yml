name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: |
            packages/common/go.mod
            services/control-plane/go.mod
            services/agent-runtime/go.mod
            services/sandbox-executor/go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend
        run: make check-js

      - name: Test Go services
        run: make test

      - name: Validate Docker Compose
        run: make compose-config

      - name: Build container images
        run: make docker-build IMAGE_REGISTRY=niceagent-ci IMAGE_TAG=${{ github.sha }}
